name: Release desktop app

# Fully CI-driven release: trigger manually from the Actions tab (or
# `gh workflow run release.yml -f bump=patch`), and it bumps package.json,
# commits + tags, then builds and publishes Linux/Windows/macOS artifacts to
# the matching GitHub Release — nothing needs to run on a local machine.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit and tag
        id: bump
        run: |
          npm version "${{ inputs.bump }}" -m "chore: release v%s"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        run: git push --follow-tags

      # The build matrix runs the 3 OS jobs in parallel, each calling
      # `electron-builder --publish always`. electron-builder looks up an
      # existing release for the tag and reuses it, but if none exists yet it
      # creates one — with 3 jobs racing that lookup at once, each job sees
      # "not found" and creates its own draft, splitting the assets across
      # duplicate releases. Pre-creating the draft here (before the matrix
      # starts) means every job finds the same release and just attaches to it.
      - name: Pre-create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.bump.outputs.tag }}"
          gh release create "$tag" --draft --title "${tag#v}" --notes "" --repo "${{ github.repository }}"

  build:
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: release:linux
          # Windows and macOS builds are disabled for now — shipping Linux only.
          # - os: windows-latest
          #   script: release:win
          # - os: macos-latest
          #   script: release:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
