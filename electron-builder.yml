appId: com.claudemanager.app
# No space: fpm (used for the .deb target) breaks on tar-ing a path with a
# space in it (/opt/${sanitizedProductName}/...). The in-app window title is
# still "Claude Manager" — this only affects the install dir / menu entry name.
productName: ClaudeManager
directories:
  output: release
files:
  - .next/**
  - public/**
  - app/generated/**
  - electron/**
  - prisma/schema.prisma
  - prisma/migrations/**
  - prisma.config.ts
  - node_modules/**
  - package.json
  - next.config.ts
# electron-builder's `files` glob silently drops any directory literally
# named `node_modules`, even nested ones matched by a broader pattern like
# `.next/**` — it has its own separate node_modules handling pipeline that
# doesn't know about this one. Turbopack's server build generates
# `.next/node_modules/<package>-<hash>` symlinks that resolve native/external
# modules (better-sqlite3, @prisma/client, the agent SDK) at runtime — without
# them the packaged app throws "Cannot find module '<hash>'" the first time
# any API route touches Prisma. Copy that folder in explicitly.
extraResources:
  - from: .next/node_modules
    to: app/.next/node_modules
# `prisma migrate deploy` needs to run as a real Node script that can shell
# out to a standalone schema-engine binary and require its own transitive
# deps freely. Packages we'd need to asarUnpack for that (@prisma/*, prisma)
# lose the ability to resolve siblings still left inside app.asar (e.g.
# @prisma/config requiring `effect`) — asar's virtual-path trick only works
# for requires made by code still running from inside the archive. Simplest
# fix that avoids the whole class of bug: don't asar this app at all.
asar: false
npmRebuild: true
publish:
  provider: github
  owner: brunonunestx
  repo: claude-manager
linux:
  target:
    - AppImage
    - deb
  category: Development
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
win:
  target:
    - nsis
